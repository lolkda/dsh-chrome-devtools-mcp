name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run tests and pack without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check packed files
        run: npm pack --dry-run

      - name: Install npm with trusted publishing support
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        run: npm install --global npm@11.19.1

      - name: Publish through npm trusted publishing (OIDC)
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        env:
          REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@lolkda/dsh-chrome-devtools-mcp@${version}" version --registry="$REGISTRY" >/dev/null 2>&1; then
            echo "@lolkda/dsh-chrome-devtools-mcp@${version} already exists; skipping"
            exit 0
          fi
          npm publish --access public --provenance --registry="$REGISTRY"
